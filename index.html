<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headline CRM - Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="margin: 0; padding: 0; background: #f6efe9;">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
        const { useState } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('checkout');
            const [customerName, setCustomerName] = useState('');
            const [phone, setPhone] = useState('');
            const [stylist, setStylist] = useState('Man');
            const [selectedServices, setSelectedServices] = useState([]);
            const [total, setTotal] = useState(0);

            const stylists = ['Man', 'Becky', 'Sammy', 'Others'];
            const themeColors = {
                'Man': '#6D3A14',
                'Becky': '#9F3E3E',
                'Sammy': '#2C496A',
                'Others': '#595959'
            };

            const services = [
                { name: 'Hair Cut & Shampoo (洗剪)', price: 350 },
                { name: 'Shampoo & Blow (洗吹)', price: 180 },
                { name: 'Hair Cut Only (單剪)', price: 300 },
                { name: 'Full Perm S (全頭電髮 短)', price: 800 },
                { name: 'Digital Perm M (電直/捲 中)', price: 1300 },
            ];

            const toggleService = (service) => {
                const isSelected = selectedServices.some(s => s.name === service.name);
                let newServices, newTotal;

                if (isSelected) {
                    newServices = selectedServices.filter(s => s.name !== service.name);
                    newTotal = total - service.price;
                } else {
                    newServices = [...selectedServices, service];
                    newTotal = total + service.price;
                }

                setSelectedServices(newServices);
                setTotal(Math.max(0, newTotal));
            };

            const handleSubmit = () => {
                if (!customerName.trim()) {
                    alert('Please enter customer name!');
                    return;
                }
                if (total <= 0) {
                    alert('Please select at least one service!');
                    return;
                }
                alert(`✅ Checkout complete!\nCustomer: ${customerName}\nTotal: $${total}`);
                setCustomerName('');
                setPhone('');
                setSelectedServices([]);
                setTotal(0);
            };

            return React.createElement('div', {
                className: 'h-screen flex flex-col bg-[#F6EFE9] text-[#4A2511]'
            },
                // Header
                React.createElement('header', {
                    className: 'bg-white shadow-sm border-b border-[#E8DCC8] px-6 py-4'
                },
                    React.createElement('div', { className: 'flex justify-between items-center' },
                        React.createElement('div', {},
                            React.createElement('h1', { className: 'text-3xl font-bold' }, 'HEADLINE'),
                            React.createElement('p', { className: 'text-xs text-gray-500 tracking-widest' }, 'Hair Salon CRM')
                        ),
                        React.createElement('div', { className: 'flex gap-2' },
                            React.createElement('button', {
                                onClick: () => setActiveTab('checkout'),
                                className: `px-6 py-2 rounded-xl font-bold transition-all ${activeTab === 'checkout' ? 'text-white' : 'bg-gray-100 text-[#4A2511]'}`,
                                style: activeTab === 'checkout' ? { backgroundColor: themeColors[stylist] } : {}
                            }, '💳 Checkout'),
                            React.createElement('button', {
                                onClick: () => setActiveTab('schedule'),
                                className: `px-6 py-2 rounded-xl font-bold transition-all ${activeTab === 'schedule' ? 'text-white' : 'bg-gray-100 text-[#4A2511]'}`,
                                style: activeTab === 'schedule' ? { backgroundColor: themeColors[stylist] } : {}
                            }, '📅 Schedule')
                        )
                    )
                ),

                // Main Content
                React.createElement('main', { className: 'flex-1 overflow-y-auto p-8 flex items-center justify-center' },
                    activeTab === 'checkout' && React.createElement('div', {
                        className: 'w-full max-w-2xl bg-white rounded-3xl p-8 shadow-lg border border-[#E8DCC8]'
                    },
                        React.createElement('div', {
                            style: {
                                width: '100%',
                                height: '4px',
                                backgroundColor: themeColors[stylist],
                                borderRadius: '4px',
                                marginBottom: '24px'
                            }
                        }),

                        React.createElement('h2', { className: 'text-2xl font-black mb-6' }, '現場結帳'),

                        // Stylist Selection
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-sm font-bold uppercase mb-3 text-gray-500' }, 'Stylist'),
                            React.createElement('div', { className: 'flex gap-2 flex-wrap' },
                                stylists.map(s =>
                                    React.createElement('button', {
                                        key: s,
                                        type: 'button',
                                        onClick: () => setStylist(s),
                                        className: 'px-4 py-2 rounded-xl font-bold text-white transition-all',
                                        style: {
                                            backgroundColor: stylist === s ? themeColors[s] : '#E8DCC8',
                                            color: stylist === s ? 'white' : '#4A2511'
                                        }
                                    }, s)
                                )
                            )
                        ),

                        // Customer Name
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-sm font-bold uppercase mb-2 text-gray-500' }, 'Customer Name'),
                            React.createElement('input', {
                                type: 'text',
                                value: customerName,
                                onChange: (e) => setCustomerName(e.target.value),
                                className: 'w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none',
                                style: { borderColor: customerName ? themeColors[stylist] : '#E8DCC8' },
                                placeholder: 'Enter name...'
                            })
                        ),

                        // Phone
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-sm font-bold uppercase mb-2 text-gray-500' }, 'Phone'),
                            React.createElement('input', {
                                type: 'tel',
                                value: phone,
                                onChange: (e) => setPhone(e.target.value),
                                className: 'w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none',
                                placeholder: '9XXXXXXXX'
                            })
                        ),

                        // Services
                        React.createElement('div', { className: 'mb-6' },
                            React.createElement('label', { className: 'block text-sm font-bold uppercase mb-3 text-gray-500' }, 'Services'),
                            React.createElement('div', { className: 'space-y-2' },
                                services.map(service =>
                                    React.createElement('button', {
                                        key: service.name,
                                        type: 'button',
                                        onClick: () => toggleService(service),
                                        className: 'w-full px-4 py-3 rounded-xl text-left font-bold transition-all',
                                        style: {
                                            backgroundColor: selectedServices.some(s => s.name === service.name) ? themeColors[stylist] : '#F0F0F0',
                                            color: selectedServices.some(s => s.name === service.name) ? 'white' : '#4A2511'
                                        }
                                    },
                                        React.createElement('span', {}, service.name, ' - $', service.price)
                                    )
                                )
                            )
                        ),

                        // Total
                        React.createElement('div', {
                            className: 'mb-6 p-4 rounded-2xl border-2',
                            style: { borderColor: themeColors[stylist], backgroundColor: '#F6EFE9' }
                        },
                            React.createElement('div', { className: 'flex justify-between items-center' },
                                React.createElement('span', { className: 'text-lg font-bold' }, 'Total:'),
                                React.createElement('span', {
                                    className: 'text-3xl font-black',
                                    style: { color: themeColors[stylist] }
                                }, '$', total)
                            )
                        ),

                        // Submit Button
                        React.createElement('button', {
                            onClick: handleSubmit,
                            className: 'w-full py-4 rounded-2xl text-white font-black text-lg transition-all hover:opacity-90',
                            style: { backgroundColor: themeColors[stylist] }
                        }, '✅ Complete Checkout')
                    ),

                    activeTab === 'schedule' && React.createElement('div', {
                        className: 'w-full max-w-4xl bg-white rounded-3xl p-8 shadow-lg border border-[#E8DCC8] text-center'
                    },
                        React.createElement('h2', { className: 'text-2xl font-black mb-4' }, '📅 Schedule Management'),
                        React.createElement('p', { className: 'text-gray-600 text-lg' }, 'Appointment scheduling feature coming soon...')
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
