<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headline CRM Preview</title>
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #f6efe9;
      }
      body {
        min-height: 100vh;
      }
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #4a2511;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .error {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 32px rgba(0,0,0,0.08);
        color: #4a2511;
      }
      code {
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="loading">Loading preview...</div></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      const rootEl = document.getElementById('root');

      function loadApp() {
        const rawUrl = 'https://raw.githubusercontent.com/headlinemb/CRM_Preview_Test-/main/v.14.12%20pro';

        fetch(rawUrl)
          .then((response) => {
            if (!response.ok) {
              throw new Error('Could not load the app source file.');
            }
            return response.text();
          })
          .then((source) => {
            const transformed = Babel.transform(source, {
              presets: [
                ['env', { modules: 'commonjs' }],
                'react'
              ]
            }).code;

            const module = { exports: {} };
            const exports = module.exports;

            const require = (name) => {
              if (name === 'react') return window.React;
              if (name === 'react-dom') return window.ReactDOM;
              if (name === 'recharts') return window.Recharts;
              throw new Error('Unsupported dependency: ' + name);
            };

            new Function('require', 'module', 'exports', transformed)(require, module, exports);

            const App = module.exports.default || module.exports;

            if (!App) {
              throw new Error('The app export was not found.');
            }

            const root = ReactDOM.createRoot(rootEl);
            root.render(React.createElement(App));
          })
          .catch((err) => {
            rootEl.innerHTML = `
              <div class="error">
                <h2>Preview failed</h2>
                <p>${String(err).replace(/</g, '&lt;')}</p>
                <p>Open the raw app file here:</p>
                <p><a href="https://github.com/headlinemb/CRM_Preview_Test-/blob/main/v.14.12%20pro">GitHub source file</a></p>
              </div>
            `;
          });
      }

      loadApp();
    </script>
  </body>
</html>
